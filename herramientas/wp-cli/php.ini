; php.ini mínimo para usar el PHP y wp-cli que trae Local WP desde cualquier terminal,
; sin depender de abrir el "site shell" de la interfaz de Local.
; Generado y verificado el 27/08/2026 contra Local con PHP 8.2.29 / WP-CLI 2.12.0.
; Si actualizas Local y cambia la versión de PHP, corrige extension_dir.

extension_dir="C:\Program Files (x86)\Local\resources\extraResources\lightning-services\php-8.2.29+0\bin\win64\ext"

; Imprescindibles para que WordPress arranque
extension=php_mysqli.dll
extension=php_mbstring.dll
extension=php_openssl.dll

; Necesarias para que 'wp media import' genere los tamaños responsive (srcset).
; Sin gd/exif las imágenes se suben pero NO se generan los tamaños: fallo silencioso.
extension=php_gd.dll
extension=php_exif.dll

; Usadas por wp-cli y por plugins habituales
extension=php_curl.dll
extension=php_zip.dll
extension=php_fileinfo.dll
extension=php_intl.dll
extension=php_sodium.dll
extension=php_pdo_mysql.dll

memory_limit=512M
